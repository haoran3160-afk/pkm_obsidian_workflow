site_name: Obsidian PKM Workflow
site_description: AI-ready PKM pipeline that streams RSS, arXiv papers, and YouTube into your Obsidian Vault.
site_url: https://yourusername.github.io/obsidian_workflow_open/
repo_url: https://github.com/yourusername/obsidian_workflow_open
repo_name: obsidian_workflow_open
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            show_source: true
            show_root_heading: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
    - Quickstart: quickstart.md
    - Installation: installation.md
  - Configuration:
    - pkm_config.json: configuration.md
    - Environment Variables: environment.md
  - Customization:
    - Note Templates: templates.md
    - Writing Plugins: plugins.md
  - Reference:
    - CLI Reference: cli.md
    - API Reference: api.md
  - Community:
    - Contributing: contributing.md
    - Changelog: changelog.md
    - Security: security.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yourusername/obsidian_workflow_open
