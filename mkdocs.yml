site_name: PKM Obsidian Workflow
site_description: Local-first AI digest workflow for Obsidian, with raw capture, strict curation, and vault-native output.
site_url: https://haoran3160-afk.github.io/pkm_obsidian_workflow/
repo_url: https://github.com/haoran3160-afk/pkm_obsidian_workflow
repo_name: haoran3160-afk/pkm_obsidian_workflow
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            show_source: true
            show_root_heading: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
    - Quickstart: quickstart.md
    - Workflow Walkthrough: workthrough.md
  - Customization:
    - Source Plugins: plugins.md
  - Samples:
    - AI Daily Sample: sample_outputs/ai-daily-brief-sample.md
    - Paper Note Sample: sample_outputs/paper-note-sample.md
    - Video Note Sample: sample_outputs/video-note-sample.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/haoran3160-afk/pkm_obsidian_workflow
