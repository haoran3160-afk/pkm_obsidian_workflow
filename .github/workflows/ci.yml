name: CI

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint and types
        run: |
          python -m ruff check src tests
          python -m mypy src/pkm_workflow
      - name: Portable daily workflow contracts
        run: python -m pytest tests/test_ai_daily_luna.py tests/test_ai_daily_production.py tests/test_daily_content.py -q

